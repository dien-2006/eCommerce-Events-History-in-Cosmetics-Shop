name: ELT quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-and-contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-bookworm
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_ops
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements-dev.txt -c requirements.lock
      - run: python scripts/bootstrap.py
      - run: make test
      - run: .venv/bin/python -m pytest tests/integration/test_registry.py -q
        env:
          OPS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_ops
      - run: .venv/bin/dbt parse --project-dir dbt --profiles-dir dbt
      - run: docker compose --env-file .env.deploy config --quiet
  airflow-dags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install 'apache-airflow==3.1.7' --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.1.7/constraints-3.12.txt
      - run: python scripts/check_dags.py
        env:
          PYTHONPATH: .
          AIRFLOW_HOME: /tmp/airflow-ci
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  spark-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements-dev.txt -c requirements.lock
      - run: bash scripts/integration.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spark-dbt-test-evidence
          path: artifacts/integration/
  container-builds:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: .
            file: infra/airflow/Dockerfile
            name: airflow
          - context: .
            file: spark/Dockerfile
            name: spark
          - context: ./superset
            file: superset/Dockerfile
            name: superset
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
