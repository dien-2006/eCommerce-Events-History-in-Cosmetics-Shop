version: 2
models:
  - name: daily_sales_by_category
    description: Revenue by UTC date, category and brand. Does not claim order-level AOV.
    columns:
      - name: event_date
        data_tests: [not_null]
      - name: revenue
        data_tests: [not_null]
  - name: funnel_steps_daily
    description: Ordered session funnel attributed to session start date.
    columns:
      - name: event_date
        data_tests: [not_null, unique]
  - name: rfm_segments
    description: Current selected as-of snapshot. Frequency counts purchasing sessions; 5 is best.
    columns:
      - name: user_id
        data_tests: [not_null, unique]
      - name: snapshot_date
        data_tests: [not_null]
      - name: segment
        data_tests:
          - accepted_values:
              arguments:
                values: [champions, loyal, at_risk, hibernating, others]
