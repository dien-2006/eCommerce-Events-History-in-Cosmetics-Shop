name: cosmetics_lakehouse
version: "2.0.0"
config-version: 2
profile: cosmetics_lakehouse
model-paths: [models]
test-paths: [tests]
macro-paths: [macros]
clean-targets: [target, dbt_packages]
vars:
  project_name: cosmetics
  max_invalid_ratio: 0.01
models:
  cosmetics_lakehouse:
    +file_format: iceberg
    +tblproperties:
      format-version: "2"
    staging:
      +schema: "{{ var('project_name', 'cosmetics') }}_silver"
    gold:
      +schema: "{{ var('project_name', 'cosmetics') }}_gold"
      +materialized: table
