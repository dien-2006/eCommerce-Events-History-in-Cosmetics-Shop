spark.sql.extensions org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.defaultCatalog lakehouse
spark.sql.catalog.lakehouse org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.catalog-impl org.apache.iceberg.jdbc.JdbcCatalog
spark.sql.catalog.lakehouse.io-impl org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lakehouse.s3.path-style-access true
spark.sql.catalog.lakehouse.jdbc.schema-version V1
spark.hadoop.fs.s3a.path.style.access true
spark.hadoop.fs.s3a.connection.ssl.enabled false
spark.hadoop.fs.s3a.impl org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider com.amazonaws.auth.EnvironmentVariableCredentialsProvider
spark.sql.session.timeZone UTC
spark.sql.ansi.enabled false
spark.sql.shuffle.partitions 8
spark.sql.adaptive.enabled true
spark.sql.sources.partitionOverwriteMode dynamic
spark.sql.csv.parser.columnPruning.enabled false
spark.sql.hive.thriftServer.singleSession false
spark.sql.thriftServer.incrementalCollect true
spark.sql.warehouse.dir /opt/spark/warehouse
spark.driver.maxResultSize 512m
spark.ui.enabled true
spark.eventLog.enabled true
spark.eventLog.dir /opt/spark/events
spark.redaction.regex (?i)secret|password|token|access[.]?key
spark.sql.catalog.lakehouse.cache-enabled false
