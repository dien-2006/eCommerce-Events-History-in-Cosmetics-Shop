# ---------- Spark core ----------
spark.master                     spark://spark-master:7077
spark.eventLog.enabled           true
spark.eventLog.dir               /tmp/spark-events
spark.sql.session.timeZone       UTC

# ---------- Iceberg: REST catalog ----------
spark.sql.extensions                         org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.rest                       org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.rest.catalog-impl          org.apache.iceberg.rest.RESTCatalog
spark.sql.catalog.rest.uri                   ${ICEBERG_REST_URI}
spark.sql.catalog.rest.warehouse             ${ICEBERG_WAREHOUSE}

# ---------- S3A -> MinIO ----------
spark.hadoop.fs.s3a.endpoint                 ${MINIO_ENDPOINT_INTERNAL}
spark.hadoop.fs.s3a.access.key               ${MINIO_ROOT_USER}
spark.hadoop.fs.s3a.secret.key               ${MINIO_ROOT_PASSWORD}
spark.hadoop.fs.s3a.path.style.access        true
spark.hadoop.fs.s3a.connection.ssl.enabled   false
spark.hadoop.fs.s3a.impl                     org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# ---------- Iceberg file IO (S3) ----------
spark.sql.catalog.rest.io-impl               org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.rest.s3.endpoint           ${MINIO_ENDPOINT_INTERNAL}
spark.sql.catalog.rest.s3.path-style-access  true

# ---------- Jars (mounted to /opt/spark/jars) ----------
# NOTE: Some Spark builds ignore wildcards; keep also passing --jars in submit command for reliability.
spark.jars                                   /opt/spark/jars/iceberg-spark-runtime-3.5_2.12-1.6.0.jar,/opt/spark/jars/hadoop-aws-3.3.6.jar,/opt/spark/jars/aws-java-sdk-bundle-1.12.262.jar